# CI: build on push and PR to main/master
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      target:
        description: Build target for a manual run
        type: choice
        options:
          - windows
          - linux
          - all
        default: windows
        required: true

jobs:
  build-linux:
    name: Build (Ubuntu)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'linux' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev qt6-svg-dev qt6-tools-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev

      - name: Configure and build
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ctest -C Release --output-on-failure || true

  build-windows-vcpkg:
    name: Build (Windows, vcpkg)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'windows' || inputs.target == 'all' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure with vcpkg
        shell: pwsh
        run: |
          cmake -S . -B build-windows `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=OFF `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-windows --config Release --parallel
