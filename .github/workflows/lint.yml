# Lint: clang-format check on changed files only (fails if changed code would be reformatted)
name: Lint

on:
  push:
    branches: ['**']
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Get changed source files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BASE="$PUSH_BASE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            DEFAULT_BRANCH_REF="refs/remotes/origin/$DEFAULT_BRANCH"
            if ! git show-ref --verify --quiet "$DEFAULT_BRANCH_REF"; then
              echo "::error::Default branch ref $DEFAULT_BRANCH_REF is unavailable."
              exit 1
            fi
            if ! BASE="$(git merge-base HEAD "$DEFAULT_BRANCH_REF")"; then
              echo "::error::Could not find a merge base with $DEFAULT_BRANCH_REF."
              exit 1
            fi
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::Comparison base $BASE is unavailable; refusing to skip formatting checks."
            exit 1
          fi
          if ! CHANGED_PATHS="$(git diff --name-only "$BASE" HEAD -- src/)"; then
            echo "::error::Could not determine changed source files from $BASE to HEAD."
            exit 1
          fi
          SRC_FILES=$(printf '%s\n' "$CHANGED_PATHS" \
            | grep -E '\.(cpp|h)$' \
            | grep -v '/translations/' \
            || true)
          if [ -z "$SRC_FILES" ]; then
            COUNT=0
          else
            COUNT=$(echo "$SRC_FILES" | grep -c .)
          fi
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = "0" ]; then
            echo "No changed source files to check."
            exit 0
          fi
          echo "$SRC_FILES" > changed_files.txt

      - name: Check formatting
        if: steps.changed.outputs.count != '0'
        run: |
          cat changed_files.txt | xargs clang-format --dry-run -Werror
          echo "All changed files are formatted."
