# Release: build .deb, AppImage and attach to GitHub Release on version tag (issues #64, #37)
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.2)"
        required: true
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
              echo "Invalid release version: $RELEASE_VERSION" >&2
              exit 2
            fi
            VERSION="$RELEASE_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(sed -n 's/^#define VERSION "\([^"]*\)".*/\1/p' version.h.in)
          fi
          sed -i "s/^#define VERSION \"[^\"]*\"/#define VERSION \"${VERSION}\"/" version.h.in
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev qt6-svg-dev qt6-tools-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev

      - name: Build .deb
        run: ./build-deb.sh -y build

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: deb-package
          path: scantailor-advanced_*_amd64.deb

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
              echo "Invalid release version: $RELEASE_VERSION" >&2
              exit 2
            fi
            VERSION="$RELEASE_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(sed -n 's/^#define VERSION "\([^"]*\)".*/\1/p' version.h.in)
          fi
          sed -i "s/^#define VERSION \"[^\"]*\"/#define VERSION \"${VERSION}\"/" version.h.in
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev qt6-svg-dev qt6-tools-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev \
            file

      - name: Build and install to AppDir
        run: |
          mkdir build-appimage && cd build-appimage
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr ..
          make -j$(nproc)
          make install DESTDIR=AppDir

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DISABLE_COPYRIGHT_FILES_DEPLOYMENT: 1
        run: |
          cd build-appimage
          export QMAKE=/usr/bin/qmake66
          # Bundle Qt platform plugins (e.g. xcb) via linuxdeploy-plugin-qt; same-dir discovery.
          ../linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt -e AppDir/usr/bin/scantailor-advanced --output appimage
          OUT=$(ls -1 *.AppImage 2>/dev/null | head -1)
          mv "$OUT" "../scantailor-advanced-${VERSION}-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: appimage
          path: scantailor-advanced-*-x86_64.AppImage

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-deb, build-appimage]
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: deb-package
      - uses: actions/download-artifact@v5
        with:
          name: appimage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            scantailor-advanced_*_amd64.deb
            scantailor-advanced-*-x86_64.AppImage
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
