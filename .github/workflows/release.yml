# Manually publish packages built from a version tag.
name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-rc*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.build-info.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      promote: ${{ steps.tag.outputs.promote }}
      rc_tag: ${{ steps.tag.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine application version
        id: build-info
        uses: ./.github/actions/version-info

      - name: Verify tag and commit
        id: tag
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ steps.build-info.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Select a version tag in the form vX.Y.Z." >&2
            exit 1
          fi
          tag="${REF#refs/tags/}"
          if [[ "$tag" != "v$VERSION" ]]; then
            echo "Tag $tag does not match application version $VERSION." >&2
            exit 1
          fi
          git fetch --no-tags origin "$REF"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]] ||
             [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The tag no longer points to the selected commit." >&2
            exit 1
          fi

          git fetch --tags origin
          release_tags="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
          selected_rc=""
          selected_rc_number=0
          asset_suffixes=(
            linux-x86_64.deb
            linux-x86_64.rpm
            linux-x86_64.AppImage
            linux-x86_64.flatpak
            macos-arm64.zip
            windows-x64.zip
          )
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            if [[ "$candidate" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc([1-9][0-9]*)$ ]]; then
              candidate_version="${BASH_REMATCH[1]}"
              candidate_number="${BASH_REMATCH[2]}"
            else
              continue
            fi
            [[ "$candidate_version" == "$VERSION" ]] || continue
            [[ "$(git rev-parse "${candidate}^{commit}")" == "$GITHUB_SHA" ]] || continue
            grep -Fxq "$candidate" <<< "$release_tags" || continue
            candidate_asset_version="${candidate#v}"

            is_draft="$(gh release view "$candidate" --json isDraft --jq '.isDraft')"
            is_prerelease="$(gh release view "$candidate" --json isPrerelease --jq '.isPrerelease')"
            [[ "$is_draft" == "false" && "$is_prerelease" == "true" ]] || continue
            assets="$(gh release view "$candidate" --json assets \
              --jq '.assets[] | select(.state == "uploaded" and .size > 0) | .name')"
            complete=true
            for suffix in "${asset_suffixes[@]}"; do
              rc_asset="scantailor-advanced-${candidate_asset_version}-${suffix}"
              stable_asset="scantailor-advanced-${VERSION}-${suffix}"
              if ! grep -Fxq "$rc_asset" <<< "$assets" &&
                 ! grep -Fxq "$stable_asset" <<< "$assets"; then
                complete=false
                break
              fi
            done
            if [[ "$complete" == "true" ]] && ((candidate_number > selected_rc_number)); then
              selected_rc="$candidate"
              selected_rc_number="$candidate_number"
            fi
          done < <(git tag --list "v${VERSION}-rc*")

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ -n "$selected_rc" ]]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
            echo "rc_tag=$selected_rc" >> "$GITHUB_OUTPUT"
            echo "Promoting complete RC $selected_rc from this commit."
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "rc_tag=" >> "$GITHUB_OUTPUT"
            echo "No complete RC release exists for this commit; building stable assets."
          fi

  linux:
    needs: validate
    if: ${{ needs.validate.outputs.promote != 'true' }}
    uses: ./.github/workflows/build-linux.yml
    with:
      package: all
      release: true

  windows:
    needs: validate
    if: ${{ needs.validate.outputs.promote != 'true' }}
    uses: ./.github/workflows/build-windows.yml
    with:
      release: true

  macos:
    needs: validate
    if: ${{ needs.validate.outputs.promote != 'true' }}
    uses: ./.github/workflows/build-macos.yml
    with:
      release: true

  flatpak:
    needs: validate
    if: ${{ needs.validate.outputs.promote != 'true' }}
    uses: ./.github/workflows/flatpak.yml
    with:
      release: true

  release:
    name: Create GitHub Release
    needs: [validate, linux, windows, macos, flatpak]
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
        (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
        (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
        (needs.flatpak.result == 'success' || needs.flatpak.result == 'skipped')
      }}
    concurrency:
      group: release-publish-${{ needs.validate.outputs.version }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag still points to the selected commit
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]] ||
             [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The tag no longer points to the selected commit." >&2
            exit 1
          fi

      - name: Revalidate matching RC before promotion
        if: ${{ needs.validate.outputs.promote == 'true' }}
        env:
          RC_TAG: ${{ needs.validate.outputs.rc_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RC_TAG"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]]; then
            echo "RC tag $RC_TAG no longer points to the selected commit." >&2
            exit 1
          fi

          actual_tag="$(gh release view "$RC_TAG" --json tagName --jq '.tagName')"
          is_draft="$(gh release view "$RC_TAG" --json isDraft --jq '.isDraft')"
          is_prerelease="$(gh release view "$RC_TAG" --json isPrerelease --jq '.isPrerelease')"
          if [[ "$actual_tag" != "$RC_TAG" || "$is_draft" != "false" ||
                "$is_prerelease" != "true" ]]; then
            echo "RC release $RC_TAG is no longer a published prerelease." >&2
            exit 1
          fi

          assets="$(gh release view "$RC_TAG" --json assets \
            --jq '.assets[] | select(.state == "uploaded" and .size > 0) | .name')"
          RC_VERSION="${RC_TAG#v}"
          asset_suffixes=(
            linux-x86_64.deb
            linux-x86_64.rpm
            linux-x86_64.AppImage
            linux-x86_64.flatpak
            macos-arm64.zip
            windows-x64.zip
          )
          for suffix in "${asset_suffixes[@]}"; do
            rc_asset="scantailor-advanced-${RC_VERSION}-${suffix}"
            stable_asset="scantailor-advanced-${VERSION}-${suffix}"
            if ! grep -Fxq "$rc_asset" <<< "$assets" &&
               ! grep -Fxq "$stable_asset" <<< "$assets"; then
              echo "RC release $RC_TAG is missing a complete asset for $suffix." >&2
              echo "Aborting promotion; rerun the stable release to use the build fallback." >&2
              exit 1
            fi
          done

      - name: Promote matching RC release
        if: ${{ needs.validate.outputs.promote == 'true' }}
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          RC_TAG: ${{ needs.validate.outputs.rc_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/rename-release-assets.sh \
            --yes "$RC_TAG" "${RC_TAG#v}" "$VERSION" prefer-source
          gh release edit "$RC_TAG" --tag "$TAG" --title "$TAG" \
            --prerelease=false --draft=false
          actual_tag="$(gh release view "$TAG" --json tagName --jq '.tagName')"
          is_prerelease="$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')"
          if [[ "$actual_tag" != "$TAG" || "$is_prerelease" != "false" ]]; then
            echo "Failed to promote $RC_TAG to stable release $TAG." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v5
        if: ${{ needs.validate.outputs.promote != 'true' }}
        with:
          name: scantailor-advanced-${{ needs.validate.outputs.version }}-linux-x86_64-deb
          path: release-assets
      - uses: actions/download-artifact@v5
        if: ${{ needs.validate.outputs.promote != 'true' }}
        with:
          name: scantailor-advanced-${{ needs.validate.outputs.version }}-linux-x86_64-rpm
          path: release-assets
      - uses: actions/download-artifact@v5
        if: ${{ needs.validate.outputs.promote != 'true' }}
        with:
          name: scantailor-advanced-${{ needs.validate.outputs.version }}-linux-x86_64-appimage
          path: release-assets
      - uses: actions/download-artifact@v5
        if: ${{ needs.validate.outputs.promote != 'true' }}
        with:
          name: scantailor-advanced-${{ needs.validate.outputs.version }}-linux-x86_64-flatpak
          path: release-assets
      - uses: actions/download-artifact@v5
        if: ${{ needs.validate.outputs.promote != 'true' }}
        with:
          name: scantailor-advanced-${{ needs.validate.outputs.version }}-macos-arm64
          path: release-assets
      - uses: actions/download-artifact@v5
        if: ${{ needs.validate.outputs.promote != 'true' }}
        with:
          name: scantailor-advanced-${{ needs.validate.outputs.version }}-windows-x64
          path: windows-package

      - name: Package Windows and verify release assets
        if: ${{ needs.validate.outputs.promote != 'true' }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test -f windows-package/scantailor-advanced.exe
          (cd windows-package && zip -qr "../release-assets/scantailor-advanced-${VERSION}-windows-x64.zip" .)
          for asset in \
            "scantailor-advanced-${VERSION}-linux-x86_64.deb" \
            "scantailor-advanced-${VERSION}-linux-x86_64.rpm" \
            "scantailor-advanced-${VERSION}-linux-x86_64.AppImage" \
            "scantailor-advanced-${VERSION}-linux-x86_64.flatpak" \
            "scantailor-advanced-${VERSION}-macos-arm64.zip" \
            "scantailor-advanced-${VERSION}-windows-x64.zip"; do
            test -s "release-assets/$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done

      - name: Create GitHub Release
        if: ${{ needs.validate.outputs.promote != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
