# Manually publish packages built from a version tag.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.build-info.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine application version
        id: build-info
        uses: ./.github/actions/version-info

      - name: Verify tag and commit
        id: tag
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ steps.build-info.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Select a version tag in the form vX.Y.Z." >&2
            exit 1
          fi
          tag="${REF#refs/tags/}"
          if [[ "$tag" != "v$VERSION" ]]; then
            echo "Tag $tag does not match application version $VERSION." >&2
            exit 1
          fi
          git fetch --no-tags origin "$REF"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]] ||
             [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The tag no longer points to the selected commit." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    needs: validate
    uses: ./.github/workflows/build-linux.yml
    with:
      package: all
      release: true

  windows:
    needs: validate
    uses: ./.github/workflows/build-windows.yml
    with:
      release: true

  macos:
    needs: validate
    uses: ./.github/workflows/build-macos.yml
    with:
      release: true

  flatpak:
    needs: validate
    uses: ./.github/workflows/flatpak.yml
    with:
      release: true

  release:
    name: Create GitHub Release
    needs: [validate, linux, windows, macos, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag still points to the selected commit
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]] ||
             [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The tag no longer points to the selected commit." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v5
        with:
          name: scantailor-advanced-${{ needs.validate.outputs.version }}-linux-x86_64-deb
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          name: scantailor-advanced-${{ needs.validate.outputs.version }}-linux-x86_64-rpm
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          name: scantailor-advanced-${{ needs.validate.outputs.version }}-linux-x86_64-appimage
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          name: scantailor-advanced-${{ needs.validate.outputs.version }}-linux-x86_64-flatpak
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          name: scantailor-advanced-${{ needs.validate.outputs.version }}-macos-arm64
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          name: scantailor-advanced-${{ needs.validate.outputs.version }}-windows-x64
          path: windows-package

      - name: Package Windows and verify release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test -f windows-package/scantailor-advanced.exe
          (cd windows-package && zip -qr "../release-assets/scantailor-advanced-${VERSION}-windows-x64.zip" .)
          for asset in \
            "scantailor-advanced-${VERSION}-linux-x86_64.deb" \
            "scantailor-advanced-${VERSION}-linux-x86_64.rpm" \
            "scantailor-advanced-${VERSION}-linux-x86_64.AppImage" \
            "scantailor-advanced-${VERSION}-linux-x86_64.flatpak" \
            "scantailor-advanced-${VERSION}-macos-arm64.zip" \
            "scantailor-advanced-${VERSION}-windows-x64.zip"; do
            test -s "release-assets/$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
