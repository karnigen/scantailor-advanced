name: Build Linux

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build"
        required: true
        default: "all"
        type: choice
        options:
          - deb
          - rpm
          - appimage
          - all
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-package:
    name: Build ${{ inputs.package }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Determine build version
        id: build-info
        uses: ./.github/actions/version-info
        with:
          release: ${{ inputs.release && 'true' || 'false' }}

      - name: Validate package selection
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            deb|rpm|appimage|all) ;;
            *) echo "Invalid package selection: $PACKAGE" >&2; exit 1 ;;
          esac

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            build-essential cmake file \
            libjpeg-dev libpng-dev \
            libtiff-dev zlib1g-dev \
            libtomlplusplus-dev \
            qt6-base-dev qt6-svg-dev \
            qt6-tools-dev qt6-tools-dev-tools \
            qt6-base-private-dev \
            libpthread-stubs0-dev \
            rpm libfuse2t64

      - name: Configure and build for AppImage or RPM
        if: ${{ inputs.package == 'appimage' || inputs.package == 'rpm' || inputs.package == 'all' }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTS=OFF
          cmake --build build --config Release --parallel "$(nproc)"

      - name: Build RPM package
        if: ${{ inputs.package == 'rpm' || inputs.package == 'all' }}
        working-directory: build
        run: |
          cpack -G RPM
          mv scantailor*.rpm "scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64.rpm"

      - name: Upload RPM artifact
        if: ${{ inputs.package == 'rpm' || inputs.package == 'all' }}
        uses: actions/upload-artifact@v5
        with:
          name: scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64-rpm
          path: build/scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64.rpm
          if-no-files-found: error

      - name: Build DEB package
        if: ${{ inputs.package == 'deb' || inputs.package == 'all' }}
        run: |
          ./scripts/build/build-deb.sh -y build
          mv "scantailor-advanced_${{ steps.build-info.outputs.version }}_amd64.deb" "scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64.deb"

      - name: Upload DEB artifact
        if: ${{ inputs.package == 'deb' || inputs.package == 'all' }}
        uses: actions/upload-artifact@v5
        with:
          name: scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64-deb
          path: scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64.deb
          if-no-files-found: error

      - name: Download linuxdeploy
        if: ${{ inputs.package == 'appimage' || inputs.package == 'all' }}
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        if: ${{ inputs.package == 'appimage' || inputs.package == 'all' }}
        run: |
          cd build
          rm -rf AppDir
          make install DESTDIR=AppDir
          export QMAKE=/usr/bin/qmake6
          ../linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            -e AppDir/usr/bin/scantailor-advanced \
            --output appimage
          OUT=$(ls -1 *.AppImage 2>/dev/null | head -1)
          mv "$OUT" "../scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64.AppImage"

      - name: Upload AppImage artifact
        if: ${{ inputs.package == 'appimage' || inputs.package == 'all' }}
        uses: actions/upload-artifact@v5
        with:
          name: scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64-appimage
          path: scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64.AppImage
          if-no-files-found: error
