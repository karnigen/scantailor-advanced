name: Build Linux

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu 24.04 (vcpkg)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake libtool \
            libfontconfig1-dev libfreetype-dev \
            libgl1-mesa-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libxcb-xinput-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Cache PCRE2 submodule metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r '.default.pcre2.baseline' \
            "$GITHUB_WORKSPACE/vcpkg/versions/baseline.json")"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Could not determine the PCRE2 version from the vcpkg baseline." >&2
            exit 1
          fi

          downloads_dir="$GITHUB_WORKSPACE/vcpkg/downloads"
          mkdir -p "$downloads_dir"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/PCRE2Project/pcre2/contents/deps/sljit?ref=pcre2-${version}" \
            --output "$downloads_dir/pcre2-pcre2-${version}-sljit-gitlink.json"

      - name: Configure
        run: >
          cmake -S . -B build-linux
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DBUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-linux --config Release --parallel "$(nproc)"
