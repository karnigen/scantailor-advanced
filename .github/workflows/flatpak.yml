# Build the in-repo Flatpak manifest (smoke build + downloadable bundle).
# This does not publish to Flathub; see README and https://github.com/ScanTailor-Advanced/scantailor-advanced/issues/105
name: Flatpak

on:
  push:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Determine build version
        id: build-info
        uses: ./.github/actions/version-info

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache flatpak-builder
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('flatpak/org.scantailor.Advanced.json') }}-${{ runner.os }}

      - name: Build Flatpak
        run: |
          mkdir -p "$RUNNER_TEMP/flatpak-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/flatpak-source"
          flatpak-builder --user --repo=repo --force-clean build-dir "$RUNNER_TEMP/flatpak-source/flatpak/org.scantailor.Advanced.json" --install-deps-from=flathub

      - name: Create single-file bundle
        run: |
          flatpak build-bundle repo "scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64.flatpak" org.scantailor.Advanced

      - name: Verify bundle metadata
        run: |
          flatpak install --user --noninteractive --no-deps --bundle "scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64.flatpak"
          actual=$(flatpak list --user --app --columns=name,application,version | awk -F '\t' '$2 == "org.scantailor.Advanced" { print $1 "\t" $3 }')
          expected=$(printf 'ScanTailor Advanced\t%s' "${{ steps.build-info.outputs.version }}")
          if [ "$actual" != "$expected" ]; then
            printf 'Unexpected Flatpak name/version: %s\n' "$actual" >&2
            exit 1
          fi

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64-flatpak
          path: scantailor-advanced-${{ steps.build-info.outputs.id }}-linux-x86_64.flatpak
          if-no-files-found: error
