# Build the in-repo Flatpak manifest (smoke build + downloadable bundle).
# This does not publish to Flathub; see README and https://github.com/ScanTailor-Advanced/scantailor-advanced/issues/105
name: Flatpak

on:
  push:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache flatpak-builder
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('flatpak/org.scantailor.Advanced.json') }}-${{ runner.os }}

      - name: Build Flatpak
        run: |
          mkdir -p "$RUNNER_TEMP/flatpak-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/flatpak-source"
          flatpak-builder --user --repo=repo --force-clean build-dir "$RUNNER_TEMP/flatpak-source/flatpak/org.scantailor.Advanced.json" --install-deps-from=flathub

      - name: Create single-file bundle
        run: |
          flatpak build-bundle repo scantailor-advanced.flatpak org.scantailor.Advanced

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: scantailor-advanced-flatpak
          path: scantailor-advanced.flatpak
          if-no-files-found: error
